<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ريماس 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8374a;
    --deep-rose: #b01a2a;
    --blush: #fce4ec;
    --gold: #d4a855;
    --dark: #1a0a0e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Tajawal', sans-serif; background: var(--dark); overflow-x: hidden; }

  #page1 {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 60% 40%, #3d0b14 0%, #1a0408 60%, #0d0205 100%);
    position: relative;
    overflow: hidden;
    padding: 30px 20px;
  }
  .petal { position: absolute; animation: floatUp linear infinite; opacity: 0.4; pointer-events: none; }
  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .page1-title {
    font-family: 'Amiri', serif;
    color: var(--gold);
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    text-align: center;
    margin-bottom: 25px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeInDown 1.2s ease forwards 0.5s;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .letter-wrap {
    position: relative;
    z-index: 10;
    opacity: 0;
    animation: letterReveal 1.5s cubic-bezier(.22,1,.36,1) forwards 0.8s;
  }
  @keyframes letterReveal {
    from { opacity: 0; transform: scale(0.85) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .letter {
    background: linear-gradient(160deg, #fffdf5 0%, #fff3e0 50%, #ffecd2 100%);
    width: min(480px, 92vw);
    padding: 45px 40px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(212,168,85,0.3), 0 4px 20px rgba(0,0,0,0.6), 0 20px 60px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .letter::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(transparent, transparent 28px, rgba(180,140,100,0.12) 28px, rgba(180,140,100,0.12) 29px);
    pointer-events: none;
  }
  .letter::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 70px;
    width: 1px;
    background: rgba(232,55,74,0.25);
  }
  .letter-header {
    font-family: 'Amiri', serif;
    font-size: clamp(1.3rem, 3.5vw, 1.7rem);
    color: var(--deep-rose);
    text-align: center;
    margin-bottom: 20px;
    font-weight: 700;
    position: relative;
    z-index: 1;
  }
  .letter-divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 22px;
    position: relative;
    z-index: 1;
  }
  .letter-text {
    font-family: 'Amiri', serif;
    font-size: clamp(1.05rem, 2.5vw, 1.3rem);
    line-height: 2;
    color: #2a1008;
    text-align: justify;
    position: relative;
    z-index: 1;
    direction: rtl;
  }
  .letter-signature {
    text-align: left;
    font-family: 'Amiri', serif;
    font-size: 1rem;
    color: var(--deep-rose);
    margin-top: 20px;
    font-style: italic;
    position: relative;
    z-index: 1;
  }
  .rose-corner {
    position: absolute;
    top: -12px; right: 20px;
    font-size: 2.5rem;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  .next-btn {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--rose), var(--deep-rose));
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(232,55,74,0.5);
    transition: all 0.3s ease;
    opacity: 0;
    animation: fadeInDown 1s ease forwards 2s;
    position: relative;
    z-index: 10;
  }
  .next-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 40px rgba(232,55,74,0.7); }
  .arrow-icon { font-size: 1.3rem; animation: arrowPulse 1.2s ease-in-out infinite; }
  @keyframes arrowPulse {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-5px); }
  }

  #page2 {
    display: none;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a0408 0%, #0d0205 100%);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  #page2.active { display: flex; }
  .p2-hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .p2-heart { position: absolute; bottom: -50px; animation: floatHeart linear infinite; opacity: 0; }
  @keyframes floatHeart {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 0.8; }
    85% { opacity: 0.6; }
    100% { transform: translateY(-110vh) scale(0.5); opacity: 0; }
  }
  .p2-question {
    font-family: 'Amiri', serif;
    color: var(--gold);
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    text-align: center;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeInDown 1s ease forwards 0.3s;
  }
  .p2-answer-box {
    background: linear-gradient(135deg, rgba(232,55,74,0.15), rgba(176,26,42,0.1));
    border: 1px solid rgba(232,55,74,0.4);
    border-radius: 16px;
    padding: 40px 50px;
    text-align: center;
    opacity: 0;
    animation: fadeInDown 1.2s ease forwards 0.8s;
    max-width: 500px;
    width: 92vw;
  }
  .p2-answer-name {
    font-family: 'Amiri', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    color: var(--rose);
    font-weight: 700;
    text-shadow: 0 0 30px rgba(232,55,74,0.6);
    animation: namePulse 2s ease-in-out infinite 2s;
  }
  @keyframes namePulse {
    0%, 100% { text-shadow: 0 0 30px rgba(232,55,74,0.6); }
    50% { text-shadow: 0 0 80px rgba(232,55,74,1), 0 0 120px rgba(232,55,74,0.5); }
  }
  .p2-subtitle { font-family: 'Tajawal', sans-serif; color: var(--blush); font-size: 1rem; margin-top: 10px; opacity: 0.8; }

  #page3 {
    display: none;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    background: #0d0205;
  }
  #page3.active { display: flex; }
  .bg-photos { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .bg-photo-item {
    position: absolute;
    bottom: -150px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    animation: floatPhoto linear infinite;
    opacity: 0;
  }
  .bg-photo-item img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes floatPhoto {
    0% { transform: translateY(0) rotate(var(--rot)); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-115vh) rotate(calc(var(--rot) + 25deg)); opacity: 0; }
  }
  .main-photo-container {
    position: relative;
    z-index: 10;
    width: min(380px, 90vw);
    height: min(520px, 85vh);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 0 3px rgba(232,55,74,0.6), 0 0 0 7px rgba(212,168,85,0.25), 0 20px 80px rgba(0,0,0,0.9), 0 0 120px rgba(232,55,74,0.25);
    animation: photoReveal 1.5s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes photoReveal {
    from { opacity: 0; transform: scale(0.8) translateY(50px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .main-photo-container img { width: 100%; height: 100%; object-fit: cover; }
  .hearts-overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .float-heart { position: absolute; bottom: -50px; animation: floatHeart2 linear infinite; opacity: 0; }
  @keyframes floatHeart2 {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    15% { opacity: 0.9; }
    85% { opacity: 0.7; }
    100% { transform: translateY(-115vh) scale(0.3) rotate(30deg); opacity: 0; }
  }
  .name-overlay {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    text-align: center;
    width: 100%;
    pointer-events: none;
  }
  .name-overlay h2 {
    font-family: 'Amiri', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: white;
    text-shadow: 0 0 20px rgba(232,55,74,0.9), 0 0 50px rgba(232,55,74,0.5), 0 2px 10px rgba(0,0,0,0.9);
    letter-spacing: 3px;
  }
  .page-transition {
    position: fixed;
    inset: 0;
    background: var(--rose);
    z-index: 999;
    transform: scaleX(0);
    transform-origin: left;
    pointer-events: none;
  }
  .back-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(232,55,74,0.3);
    border: 1px solid rgba(232,55,74,0.5);
    color: white;
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 1.2rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: all 0.3s;
  }
  .back-btn:hover { background: var(--rose); }
  .back-btn.show { display: flex; }
</style>
</head>
<body>

<div class="page-transition" id="transition"></div>

<!-- الأغنية كملف منفصل song.mp3 في نفس الفولدر -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- PAGE 1 -->
<div id="page1">
  <div id="petals"></div>
  <p class="page1-title">✦ رسالة من القلب ✦</p>
  <div class="letter-wrap">
    <div class="letter">
      <div class="rose-corner">🌹</div>
      <div class="letter-header">ريماس الغالية...</div>
      <div class="letter-divider"></div>
      <p class="letter-text">
        انتي عارفه اني بحبكِ أعلى مراحل الحب اللي هو الهوى،
        أنا بهواكِ يا ريماس..
        ونفسي نكون مع بعض على طول،
        منكنش ذكرى في حياة بعض،
        لأننا منقدرش نستغنى عن بعض أبدًا 💕
      </p>
      <div class="letter-signature">— أحمد 🌹</div>
    </div>
  </div>
  <button class="next-btn" onclick="goToPage2()">
    التالي <span class="arrow-icon">←</span>
  </button>
</div>

<!-- PAGE 2 -->
<div id="page2">
  <div class="p2-hearts" id="p2hearts"></div>
  <p class="p2-question">✦ مين أكتر حد أحمد بيحبه؟ ✦</p>
  <div class="p2-answer-box">
    <div class="p2-answer-name">ريماس 💖</div>
    <p class="p2-subtitle">دايمًا وأبدًا... بلا منازع 🌹</p>
  </div>
  <button class="next-btn" style="margin-top:35px; opacity:1; animation:none;" onclick="goToPage3()">
    التالي <span class="arrow-icon">←</span>
  </button>
</div>

  const petals = ['🌸','🌹','✿','❀','💮','🌺'];
  const petalsContainer = document.getElementById('petals');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random() * petals.length)];
    p.style.cssText = 'left:' + Math.random()*100 + '%;font-size:' + (0.8+Math.random()*1.2) + 'rem;animation-duration:' + (6+Math.random()*8) + 's;animation-delay:' + (Math.random()*8) + 's;';
    petalsContainer.appendChild(p);
  }

  function spawnP2Hearts() {
    const container = document.getElementById('p2hearts');
    const h2 = ['❤️','💖','💕','💗','💓','💞','🌹'];
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'p2-heart';
      h.textContent = h2[Math.floor(Math.random()*h2.length)];
      h.style.cssText = 'left:'+Math.random()*100+'%;font-size:'+(1+Math.random()*2)+'rem;animation-duration:'+(4+Math.random()*5)+'s;';
      container.appendChild(h);
      setTimeout(() => h.remove(), 10000);
    }, 400);
  }

  function spawnPageHearts() {
    const container = document.getElementById('heartsOverlay');
    const items = ['❤️','💖','💕','💗','💓','💞','🌹','🌸','✨','💫'];
    setInterval(() => {
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = items[Math.floor(Math.random()*items.length)];
      h.style.cssText = 'left:'+Math.random()*100+'%;font-size:'+(1+Math.random()*2)+'rem;animation-duration:'+(4+Math.random()*6)+'s;';
      container.appendChild(h);
      setTimeout(() => h.remove(), 12000);
    }, 300);
  }

  function spawnBgPhotos() {
    const container = document.getElementById('bgPhotos');
    setInterval(() => {
      const url = bgPhotoUrls[Math.floor(Math.random()*bgPhotoUrls.length)];
      const item = document.createElement('div');
      item.className = 'bg-photo-item';
      const rot = (Math.random()*30-15).toFixed(1);
      const size = 80 + Math.random()*90;
      item.style.cssText = 'left:'+Math.random()*85+'%;width:'+size+'px;height:'+(size*1.25)+'px;--rot:'+rot+'deg;animation-duration:'+(7+Math.random()*8)+'s;';
      const img = document.createElement('img');
      img.src = url;
      item.appendChild(img);
      container.appendChild(item);
      setTimeout(() => item.remove(), 18000);
    }, 700);
  }

  function goToPage2() {
    music.play().catch(() => {});
    animTransition(() => {
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').classList.add('active');
      document.getElementById('backBtn').classList.add('show');
      spawnP2Hearts();
    });
  }

  function goToPage3() {
    animTransition(() => {
      document.getElementById('page2').classList.remove('active');
      document.getElementById('page2').style.display = 'none';
      document.getElementById('page3').classList.add('active');
      spawnPageHearts();
      spawnBgPhotos();
    });
  }

  function goToPage1() {
    animTransition(() => {
      document.getElementById('page2').classList.remove('active');
      document.getElementById('page2').style.display = '';
      document.getElementById('page3').classList.remove('active');
      document.getElementById('page1').style.display = 'flex';
      document.getElementById('backBtn').classList.remove('show');
    });
  }

  function animTransition(callback) {
    const t = document.getElementById('transition');
    t.style.transition = 'transform 0.45s cubic-bezier(.86,0,.07,1)';
    t.style.transformOrigin = 'left';
    t.style.transform = 'scaleX(1)';
    setTimeout(() => {
      callback();
      t.style.transformOrigin = 'right';
      t.style.transform = 'scaleX(0)';
    }, 460);
  }
</script>
